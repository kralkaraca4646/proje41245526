name: Test Google Sheets

on:
  workflow_dispatch:

jobs:
  test-sheets:
    runs-on: ubuntu-latest

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Google kütüphanelerini kur
        run: |
          pip install google-api-python-client google-auth

      - name: Google Sheets'i test et
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import os
          import json
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build

          data = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])

          credentials = Credentials.from_service_account_info(
              data,
              scopes=["https://www.googleapis.com/auth/spreadsheets"]
          )

          service = build("sheets", "v4", credentials=credentials)

          sheet_id = "14zE4-CTGsKf4N5_fsnX38xufEPP1xxwdVTFgpbKXzO4"

          result = service.spreadsheets().values().get(
              spreadsheetId=sheet_id,
              range="A:D"
          ).execute()

          values = result.get("values", [])

          print("Google Sheets bağlantısı başarılı!")
          print("Tablodaki satır sayısı:", len(values))

          for row in values:
              print(row)
          PY
