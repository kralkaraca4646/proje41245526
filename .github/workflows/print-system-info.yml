name: YouTube upload test

on:
  workflow_dispatch:

jobs:
  upload-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python packages
        run: |
          pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Install Python packages
        run: |
          pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create test video
        run: |
          ffmpeg -f lavfi -i color=c=black:s=1280x720:d=5 \
            -vf "drawtext=text='YouTube Upload Test':fontcolor=white:fontsize=48:x=(w-text_w)/2:y=(h-text_h)/2" \
            test_video.mp4

      - name: Upload video to YouTube
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          import json
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"]
          )

          youtube = build("youtube", "v3", credentials=credentials)

          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": "GitHub Actions YouTube Upload Test",
                      "description": "Otomasyon sistemi test videosu.",
                      "categoryId": "22"
                  },
                  "status": {
                      "privacyStatus": "private"
                  }
              },
              media_body=MediaFileUpload(
                  "test_video.mp4",
                  chunksize=-1,
                  resumable=True
              )
          )

          response = request.execute()

          print("Video başarıyla yüklendi!")
          print("Video ID:", response["id"])
          PY
